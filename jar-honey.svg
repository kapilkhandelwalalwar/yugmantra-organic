<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 700" width="520" height="700" role="img" aria-label="Ashwagandha jar">
  <defs>
    <linearGradient id="ghe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#A8621B"/>
      <stop offset=".34" stop-color="#D08A2A"/>
      <stop offset=".72" stop-color="#EDB24F"/>
      <stop offset="1"   stop-color="#A8621B"/>
    </linearGradient>
    <linearGradient id="lde" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#8A5312"/>
      <stop offset=".16"  stop-color="#C99036"/>
      <stop offset=".40"  stop-color="#FFF0C4"/>
      <stop offset=".58"  stop-color="#C99036"/>
      <stop offset=".82"  stop-color="#8A5312"/>
      <stop offset="1"    stop-color="#6E4A12"/>
    </linearGradient>
    <linearGradient id="gle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".62"/>
      <stop offset=".14" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset=".70" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".90" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1"   stop-color="#7a5a22" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="lbe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFAF2"/>
      <stop offset="1" stop-color="#F0E7D4"/>
    </linearGradient>
    <radialGradient id="she" cx=".5" cy=".5" r=".5">
      <stop offset="0"   stop-color="#6b4a17" stop-opacity=".38"/>
      <stop offset="1"   stop-color="#6b4a17" stop-opacity="0"/>
    </radialGradient>
    <filter id="gre" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="d"/>
      <feComposite in="d" in2="SourceGraphic" operator="in" result="c"/>
      <feBlend in="SourceGraphic" in2="c" mode="multiply"/>
    </filter>
    <clipPath id="cpe">
      <path d="M143 146
               L143 224
               Q143 258 78 266
               Q64 276 64 302
               L64 606
               Q64 636 94 636
               L426 636
               Q456 636 456 606
               L456 302
               Q456 276 442 266
               Q377 258 377 224
               L377 146 Z"/>
    </clipPath>
  </defs>

  <!-- cast shadow -->
  <ellipse cx="260" cy="658" rx="230" ry="26" fill="url(#she)"/>

  <!-- glass body -->
  <path d="M143 146
           L143 224
           Q143 258 78 266
           Q64 276 64 302
           L64 606
           Q64 636 94 636
           L426 636
           Q456 636 456 606
           L456 302
           Q456 276 442 266
           Q377 258 377 224
           L377 146 Z"
        fill="#F6F1E4" fill-opacity=".55"/>

  <!-- ghee fill -->
  <g clip-path="url(#cpe)">
    <rect x="58" y="280" width="404" height="364" fill="url(#ghe)"/>
    <rect x="58" y="280" width="404" height="364" fill="url(#ghe)" filter="url(#gre)" opacity=".55"/>
    <!-- meniscus -->
    <ellipse cx="260" cy="282" rx="190" ry="15" fill="#FFF1C6" opacity=".55"/>
    <ellipse cx="260" cy="287" rx="178" ry="9" fill="#FFFAE4" opacity=".38"/>
    <!-- grain flecks -->
    <g opacity=".30" fill="#FFF6DA">
      <circle cx="188" cy="372" r="4.5"/><circle cx="318" cy="426" r="6"/>
      <circle cx="236" cy="490" r="3.6"/><circle cx="356" cy="518" r="4.2"/>
      <circle cx="156" cy="466" r="3.2"/><circle cx="274" cy="344" r="3.4"/>
      <circle cx="208" cy="552" r="5"/><circle cx="334" cy="326" r="3"/>
    </g>
    <!-- inner light -->
    <ellipse cx="177.68" cy="410" rx="46" ry="118" fill="#FFF3CE" opacity=".22"/>
  </g>

  <!-- glass sheen over everything -->
  <path d="M143 146
           L143 224
           Q143 258 78 266
           Q64 276 64 302
           L64 606
           Q64 636 94 636
           L426 636
           Q456 636 456 606
           L456 302
           Q456 276 442 266
           Q377 258 377 224
           L377 146 Z"
        fill="url(#gle)"/>
  <!-- specular streak -->
  <rect x="86" y="314" width="13" height="236" rx="7" fill="#fff" opacity=".40"/>
  <rect x="416" y="346" width="7" height="176" rx="4" fill="#fff" opacity=".22"/>

  <!-- neck ring -->
  <rect x="140" y="144" width="240" height="11" rx="5" fill="#E4DAC4" opacity=".85"/>

  <!-- lid -->
  <rect x="129" y="74" width="262" height="76" rx="9" fill="url(#lde)"/>
  <rect x="129" y="74" width="262" height="9" rx="4.5" fill="#FFF3CF" opacity=".55"/>
  <rect x="129" y="137" width="262" height="13" rx="6" fill="#7A5316" opacity=".45"/>
  <g opacity=".26" fill="#3A2708">
    <rect x="137" y="87" width="2.4" height="46" rx="1.2"/><rect x="150" y="87" width="2.4" height="46" rx="1.2"/><rect x="163" y="87" width="2.4" height="46" rx="1.2"/><rect x="176" y="87" width="2.4" height="46" rx="1.2"/><rect x="189" y="87" width="2.4" height="46" rx="1.2"/><rect x="202" y="87" width="2.4" height="46" rx="1.2"/><rect x="215" y="87" width="2.4" height="46" rx="1.2"/><rect x="228" y="87" width="2.4" height="46" rx="1.2"/><rect x="241" y="87" width="2.4" height="46" rx="1.2"/><rect x="254" y="87" width="2.4" height="46" rx="1.2"/><rect x="267" y="87" width="2.4" height="46" rx="1.2"/><rect x="280" y="87" width="2.4" height="46" rx="1.2"/><rect x="293" y="87" width="2.4" height="46" rx="1.2"/><rect x="306" y="87" width="2.4" height="46" rx="1.2"/><rect x="319" y="87" width="2.4" height="46" rx="1.2"/><rect x="332" y="87" width="2.4" height="46" rx="1.2"/><rect x="345" y="87" width="2.4" height="46" rx="1.2"/><rect x="358" y="87" width="2.4" height="46" rx="1.2"/><rect x="371" y="87" width="2.4" height="46" rx="1.2"/>
  </g>
  <ellipse cx="260" cy="77" rx="131" ry="10" fill="#FFE9B0"/>
  <ellipse cx="260" cy="76" rx="115" ry="6" fill="#C9982F" opacity=".45"/>

  <!-- label -->
  <g>
    <rect x="112" y="366" width="297" height="214" rx="4" fill="url(#lbe)"/>
    <rect x="112" y="366" width="297" height="214" rx="4" fill="none" stroke="#C9B893" stroke-width="1"/>
    <rect x="123" y="377" width="275" height="192" rx="2" fill="none" stroke="#C08A2E" stroke-width="1" opacity=".55"/>
    <!-- monogram -->
    <g transform="translate(260,416)">
      <circle r="21" fill="none" stroke="#C08A2E" stroke-width="1.1" opacity=".8"/>
      <text x="0" y="8" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#8A5F1B">Y</text>
    </g>
    <text x="260" y="462" text-anchor="middle" font-family="Inter,Helvetica,sans-serif"
          font-size="8" letter-spacing="3.4" fill="#9A8F7F">RAW · UNPASTEURISED</text>
    <text x="260" y="494" text-anchor="middle" font-family="Georgia,serif"
          font-size="25" fill="#1C1815">Ashwagandha</text>
    <line x1="226" y1="512" x2="294" y2="512" stroke="#C08A2E" stroke-width="1"/>
    <text x="260" y="536" text-anchor="middle" font-family="Inter,Helvetica,sans-serif"
          font-size="8" letter-spacing="2.6" fill="#6B6154">INFUSED RAW FOREST HONEY</text>
    <text x="260" y="560" text-anchor="middle" font-family="Inter,Helvetica,sans-serif"
          font-size="9" letter-spacing="2.2" fill="#8A5F1B">325 G</text>
  </g>
</svg>
